# CI for every push and pull request (spec/09-git-workflow.md §7.1, §10).
# Each project job runs only when that project exists and its files changed,
# so the pipeline is green on an empty repo and stays inside free minutes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.range.outputs.base }}
      head: ${{ steps.range.outputs.head }}
      android: ${{ steps.detect.outputs.android }}
      backend: ${{ steps.detect.outputs.backend }}
      web_share: ${{ steps.detect.outputs.web_share }}
      pipelines: ${{ steps.detect.outputs.pipelines }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Work out commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          head=$(git rev-parse HEAD)
          run_all=false
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            # New branch, force-push or manual run: compare with develop.
            base=$(git merge-base origin/develop "$head")
          fi
          case "$EVENT:$REF" in
            push:refs/heads/develop|push:refs/heads/main|workflow_dispatch:*) run_all=true ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "run_all=$run_all" >> "$GITHUB_OUTPUT"
          echo "Range $base..$head (run_all=$run_all)"
      - name: Detect changed projects
        id: detect
        run: |
          sh .github/scripts/detect-changes.sh \
            "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
            "${{ steps.range.outputs.run_all }}" | tee -a "$GITHUB_OUTPUT"

  commit-messages:
    name: Commit messages
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit against .githooks/commit-msg
        run: |
          sh .github/scripts/check-commit-messages.sh \
            "${{ needs.changes.outputs.base }}" "${{ needs.changes.outputs.head }}"

  android:
    name: Android (test + lint)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew testDebugUnitTest lint --stacktrace

  backend:
    name: Backend (test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew test --stacktrace

  web-share:
    name: Web share page (lint + test)
    needs: changes
    if: needs.changes.outputs.web_share == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-share
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-share/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  pipelines:
    name: Pipelines (pytest)
    needs: changes
    if: needs.changes.outputs.pipelines == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest

  infra:
    name: Infra (compose config)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/compose.yaml config --quiet
