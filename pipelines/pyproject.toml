[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jalanz-pipelines"
version = "0.0.1"
description = "Jalanz data jobs: LLM toll-rate crawler, change sets and review CLI"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
    "truststore>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jalanz-toll = "jalanz_pipelines.llm_toll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
